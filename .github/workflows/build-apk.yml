name: Build PocketLinux APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio (com os submódulos do servidor X)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Ferramentas do build nativo do servidor X
        run: sudo apt-get update && sudo apt-get install -y python3 bison patch

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865 cmake;3.22.1"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace "-ProotfsRepo=$GITHUB_REPOSITORY"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketLinux-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
